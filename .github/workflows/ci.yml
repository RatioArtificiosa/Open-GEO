name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci:check

      - name: Run tests
        run: pnpm run test:ci

      # Runs the leanWorkerBundle generateBundle assertion: fails if a
      # denylisted package (dataforseo-client, autumn-js, ...) re-enters the
      # worker's eager startup graph. See vite-plugin-lean-worker-bundle.ts.
      - name: Build worker (eager-bundle guard)
        run: pnpm vite build

      # **The website job lived here, and it cannot any more.**
      #
      # It ran `pnpm --dir web install`, `pnpm --dir web run test:protection`,
      # `pnpm --dir web run types:check` and `pnpm --dir web run build` — plus two
      # gates, `check-slop-budget` and `check-business-model`, which read
      # `web/dist/client`. **The marketing website now lives in the private
      # repository**, so every one of those steps would fail on the public repo,
      # and the whole `ci` job with them.
      #
      # Both gates moved to the private repo alongside the site they measure, and
      # are registered in `web/package.json` there. `check-business-model` moved for
      # a second reason on top of the path: it asserts the markup, the plan price
      # and the free-tier allowance, which are commercial facts that do not belong
      # in a public repository at all.
      #
      # **This is the shape to remember when moving a directory between repos: a
      # gate that reads the directory's build output fails on the repo that no
      # longer contains it.** Two of them did, and the express job was the same
      # failure in a different place. A public CI that depends on a private
      # directory is a CI that is red on `main`.

  # ── The dual-dialect matrix ────────────────────────────────────────────────
  #
  # The repository's invariant is that schema, queries and mutations work on
  # **both** SQLite and Postgres. `schema-parity.test.ts` enforces that shape,
  # and `vitest.setup.ts` makes the provider a variable, but nothing ran the
  # suite on the Postgres path until this job existed: 103 test files stub
  # `cloudflare:workers`, all with `DATABASE_PROVIDER: "d1"`, none with
  # `"postgres"`.
  #
  # That gap is not theoretical. Commit `2a785c9` is named after it — *"the
  # postgres barrel pointed at the sqlite table, so its migration was never
  # generated"* — and CI was green throughout, because only a human read
  # generator output. **A green CI run on one dialect is not evidence about the
  # other.**
  #
  # `scripts/dual-dialect-harness.test.ts` guards the switch itself, so this job
  # cannot pass by silently running SQLite twice.
  dual-dialect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [d1, postgres]
    env:
      DATABASE_PROVIDER: ${{ matrix.provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No Postgres service is started: the pg barrel resolves its connection
      # through the HYPERDRIVE binding, and a repository needs a driver while a
      # barrel does not. What this guards is the half that was actually broken
      # and never exercised — module resolution, barrel wiring, the
      # `getDatabaseProvider()` branch, and every schema-parity comparison, on
      # the Postgres path.
      - name: Run tests on ${{ matrix.provider }}
        run: pnpm run test:ci

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build self-host Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
